name: Architecture check

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tools/arch/**"
      - ".github/workflows/arch-check.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tools/arch/**"
      - ".github/workflows/arch-check.yml"

jobs:
  graph-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Current-state gate (RFC 0001 E0): module graph stays a DAG and no
      # new non-contract upward edge or dead import is introduced beyond
      # the frozen snapshots in tools/arch/*_baseline.txt.
      # --target-core8 also evaluates every current-state predicate AND
      # the RFC 0001 Phase B future-state gate (9 singleton areas incl.
      # loom.orchestration). Enabled from Phase B batch 5 (2026-09-27),
      # the batch that dissolved the {loom.hooks,loom.services,loom.tools} SCC;
      # it then stays green through the remaining lifts and prevents the
      # SCC from silently reforming (a contract-only return path can pass
      # the default predicates while closing the loop).
      - name: Architecture graph check
        run: python3 tools/arch/graph_check.py --target-core8
      # RFC 0002 F4: UI9 area-level acyclicity — 12 singleton SCCs in strict
      # rank order.  Prevents the UI area split from silently regressing.
      - name: UI9 area acyclicity check
        run: python3 tools/arch/graph_check.py --target-ui9
      # RFC 0002 F3: store placement, naming, and threading rules.
      - name: F3 store lint
        run: python3 tools/arch/graph_check.py --store-lint
      # TLL graph acyclicity + file-to-library grouping.
      - name: TLL acyclicity + grouping lint
        run: python3 tools/arch/graph_check.py --tll-lint
      # Negative tests: verify the lints themselves catch violations.
      - name: Arch lint negative tests
        run: |
          python3 tools/arch/test_target_ui9.py
          python3 tools/arch/test_store_lint.py
          python3 tools/arch/test_tll_lint.py
      # RFC 0001 Phase C ratchet: no interface may grow its semantic inline
      # body count above its frozen snapshot, and a new >100-body god
      # interface fails closed. Baseline: tools/arch/inline_def_baseline.txt.
      - name: Inline-definition ratchet
        run: python3 tools/arch/inline_def_check.py
